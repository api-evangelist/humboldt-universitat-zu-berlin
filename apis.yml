- aid: humboldt-universitat-zu-berlin:laudatio-repository-api
  name: LAUDATIO-Repository REST API
  x-operator: institution
  description: >-
    Documented, versioned, public read API of the LAUDATIO-Repository (Long-term Access and
    Usage of Deeply Annotated Information), the open-access research-data repository for
    historical linguistic corpora operated by HU's Department of Corpus Linguistics with the
    Computer- und Medienservice. HU publishes its own API reference at /docs/elasticapi
    naming 32 paths across corpora, documents and annotations; live probe 2026-09-01 returned
    30 corpora, 5,284 documents and 1,160 annotation layers. Classified `institution` despite
    the laudatio-repository.org domain because every ownership signal is HU's: the site
    imprint and privacy policy point at hu-berlin.de, sign-in authenticates HU accounts
    against HU's Shibboleth IdP, the source is on HU's own GitLab, and DOIs are minted under
    HU's DataCite membership as repository tib.hu-laudatio. This surface was missed entirely
    by the June 2026 profile.
  humanURL: https://www.laudatio-repository.org/docs/elasticapi
  baseURL: https://www.laudatio-repository.org/api/elasticapi/v1
