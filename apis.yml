- aid: humboldt-universitat-zu-berlin:edoc-rest
  name: edoc-Server DSpace REST API
  x-operator: institution
  description: >-
    Public, unauthenticated read API of the edoc-Server, the Open Access institutional
    repository of Humboldt-Universität zu Berlin, operated by the University Library's
    Arbeitsgruppe Elektronisches Publizieren. Live probe 2026-09-01 returned dspaceName
    "edoc-Server", dspaceVersion "DSpace 8.5-SNAPSHOT"; /core/communities and
    /discover/search/objects both answered 200, /core/items answered 401. The repository
    software is DSpace (open source, BSD, self-hosted) — the software is a third party's, the
    host, the deployment and the content are HU's, which is why this is `institution` and not
    `tenant`. HU publishes no OpenAPI for it; the three contracts below were authored by API
    Evangelist from live responses and each says so in its own description. They are three
    tag-split views of ONE surface, not three APIs — the June 2026 profile listed them as
    three separate entries and that inflation has been corrected here.
