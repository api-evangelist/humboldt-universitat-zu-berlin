- aid: humboldt-universitat-zu-berlin:edoc-oai
  name: edoc-Server OAI-PMH 2.0 Interface
  x-operator: institution
  description: >-
    OAI-PMH 2.0 metadata harvesting endpoint for the edoc institutional repository, on HU's
    own host. ?verb=Identify returned 200 on 2026-09-01 with repositoryName "edoc-Server",
    repositoryIdentifier edoc.hu-berlin.de, adminEmail edocadmins@lists.hu-berlin.de,
    earliestDatestamp 2017-06-15 and granularity YYYY-MM-DDThh:mm:ssZ. Eighteen metadata
    formats are advertised — didl, mods, xMetaDissPlus, ore, mets, xoai, dim, uketd_dc, qdc,
    oai_dc, rdf, oai_datacite, epicur, marc, marc21_huub, xMetaDissPlusPlus, etdms — and sets
    are exposed by Dewey class, document type and researchData. This is the strongest
    standards-conformant surface HU operates.
  humanURL: https://edoc-info.hu-berlin.de/en
  baseURL: https://edoc.hu-berlin.de/server/oai/request
