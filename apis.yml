aid: humboldt-universitat-zu-berlin
name: Humboldt-Universität zu Berlin
x-type: university
x-category: Public Research University
description: >-
  Humboldt-Universität zu Berlin (HU Berlin) is a public research university in Berlin,
  Germany, founded in 1810 and ranked #126 in the QS World University Rankings 2025. Like
  almost every university, HU is a federation of buyers rather than an API producer: it
  publishes no developer portal, no API terms, no SDKs and not one OpenAPI of its own, and
  every OpenAPI in this repository was authored by API Evangelist from live probes and says
  so in its own info.description. What HU does genuinely operate is scholarly and identity
  infrastructure on its own hosts. The edoc-Server institutional repository at
  edoc.hu-berlin.de (DSpace 8, self-hosted by the University Library) exposes an
  unauthenticated read REST API and a full OAI-PMH 2.0 interface advertising eighteen
  metadata formats including oai_datacite. The LAUDATIO-Repository for historical linguistic
  corpora, run by the Corpus Linguistics department with the Computer- und Medienservice,
  publishes a documented, versioned, public REST API over its Elasticsearch index. HU
  operates its own Shibboleth/SAML identity provider, registered in DFN-AAI and published to
  eduGAIN, and is a DataCite member (VLEF) minting 32,950 DOIs under its own prefix 10.18452
  across ten registered repositories. Its library discovery is an Ex Libris Primo/Alma tenancy
  and is not HU engineering. Note for machine consumers: hu-berlin.de web hosts, including
  the GitLab instance at scm.cms.hu-berlin.de, sit behind an Anubis proof-of-work bot wall
  that returns HTTP 200 with a JavaScript challenge instead of content — the data hosts
  (edoc, LAUDATIO) do not.
