  detail: >-
    Four institution-operated machine-readable surfaces were found and probed live on
    2026-09-01: the edoc-Server DSpace REST API and its OAI-PMH 2.0 interface (both on
    edoc.hu-berlin.de, HU's own domain), the LAUDATIO-Repository REST API, and HU's own
    Shibboleth/SAML identity provider as registered in DFN-AAI and eduGAIN. HU's DataCite
    membership (VLEF, ROR 01hcx6992, prefix 10.18452, 32,950 DOIs, 10 registered repositories)
    is recorded as a registry membership. Three surfaces are recorded as relationships without
    saving anyone else's contract: the Ex Libris Primo/Alma library discovery tenancy, the
    NOMAD Repository (nomad-lab.eu — a FAIRmat consortium platform whose DOIs HU mints under
    tib.hu), and the GenderOpen repository shared with FU and TU Berlin. HU itself publishes no
    OpenAPI, no developer portal, no API terms of service and no SDKs; the June 2026 profile of
    this repo claimed the edoc surface as three separate APIs, which is one surface counted
    three times, and that has been collapsed. One measurement caveat worth carrying forward:
    every hu-berlin.de WEB host probed (www., ub., cms., edoc-info., scm.) sits behind an
    Anubis proof-of-work bot wall that answers HTTP 200 with a JavaScript challenge page, so
    a status-code-only probe reads them as live content and a /llms.txt probe of
    www.hu-berlin.de returns 200 for a challenge page rather than an llms.txt. The DATA hosts
    (edoc.hu-berlin.de, media.hu-berlin.de, agnes.hu-berlin.de, laudatio-repository.org) are
    not walled, which is why coverage is `covered` and not `bot_blocked`.
